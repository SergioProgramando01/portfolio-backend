[build]
  # No necesitamos un comando de build si no tenemos un frontend que compilar
  publish = "public" # Directorio para cualquier archivo estático que tengas
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# La única regla de redirección que necesitas para tu API
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
